<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOUR SHOP • Admin Notes</title><style>body{margin:0;background:#08111f;color:#eaf2ff;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#17243a;color:#fff;cursor:pointer}.primary{background:#2563eb}.danger{background:#7f1d1d}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.card{background:#101b2d;border:1px solid #22314a;border-radius:18px;padding:18px}.notes{display:grid;gap:10px;max-height:70vh;overflow:auto}.note{padding:14px;border:1px solid #25344d;border-radius:14px;cursor:pointer}.note.active{border-color:#4f8cff;background:#12213a}.muted{color:#91a1b9;font-size:12px}input,textarea{width:100%;box-sizing:border-box;margin:7px 0 14px;padding:12px;border-radius:11px;border:1px solid #30415e;background:#0b1525;color:#fff}textarea{min-height:230px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:20px;margin-top:8px}</style></head><body><div class="wrap"><div class="top"><div><h1>📝 Admin Notes</h1><div class="muted">Private operational notes for YOUR SHOP administrators.</div></div><button class="btn" onclick="location.href='/admin/panel'">← Admin</button></div><div class="grid"><div class="card"><button class="btn primary" onclick="newNote()">＋ New note</button><div id="notes" class="notes" style="margin-top:12px"></div></div><div class="card"><input id="title" placeholder="Note title"><textarea id="content" placeholder="Write the note..."></textarea><div class="actions"><button class="btn primary" onclick="saveNote()">Save</button><button class="btn danger" onclick="removeNote()">Delete</button></div><div id="status" class="status muted"></div></div></div></div><script>let data=[],selected=null;const $=id=>document.getElementById(id);async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Request failed');return j}async function load(){try{data=(await api('/api/admin/notes')).notes||[];render()}catch(e){$('status').textContent=e.message}}function render(){$('notes').innerHTML=data.map(n=>`<div class="note ${selected&&selected.id===n.id?'active':''}" onclick="pick(${n.id})"><b>#${n.id} ${esc(n.title||'Untitled')}</b><div class="muted">${esc((n.content||'').slice(0,100))}</div></div>`).join('')||'<div class="muted">No notes.</div>'}function pick(id){selected=data.find(x=>x.id===id)||null;if(selected){$('title').value=selected.title||'';$('content').value=selected.content||''}render()}function newNote(){selected=null;$('title').value='';$('content').value='';render();$('title').focus()}async function saveNote(){try{const body={title:$('title').value,content:$('content').value};if(!body.title||!body.content)throw Error('Title and content are required');if(selected){await api('/api/admin/notes/'+selected.id,{method:'POST',body:JSON.stringify(body)})}else{await api('/api/admin/notes',{method:'POST',body:JSON.stringify(body)})}$('status').textContent='Saved.';await load()}catch(e){$('status').textContent=e.message}}async function removeNote(){if(!selected)return;$('status').textContent='Deleting...';try{await api('/api/admin/notes/'+selected.id,{method:'DELETE'});newNote();await load()}catch(e){$('status').textContent=e.message}}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load()</script></body></html>
