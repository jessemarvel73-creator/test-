<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOUR SHOP Feedback</title><link rel="stylesheet" href="/static/admin/style.css"></head><body><div class="wrap"><div class="top"><div><h1>⭐ Customer Feedback</h1><p class="muted">Read and manage feedback submitted by customers.</p></div><button class="btn" onclick="location.href='/admin'">← Admin</button></div><div id="feedbackList" class="admin-card-grid"></div></div><script>async function load(){const r=await fetch('/api/admin/feedback');const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Unable to load feedback');const box=document.getElementById('feedbackList');box.innerHTML=(d.feedback||[]).map(x=>`<article class="admin-card-item"><div>⭐ ${Number(x.rating||0)}/5</div><h3>${escapeHtml(x.first_name||x.username||'Customer')}</h3><p>${escapeHtml(x.message||'')}</p><small>${escapeHtml(x.created_at||'')} · ${escapeHtml(x.status||'new')}</small></article>`).join('')||'<div class="empty">No feedback yet.</div>';}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}load().catch(e=>document.getElementById('feedbackList').innerHTML='<div class="empty error">'+escapeHtml(e.message)+'</div>');</script></body></html>
